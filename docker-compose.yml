services:
  tor:
    build:
      context: ./docker
      dockerfile: Dockerfile.tor
    container_name: tor
    networks:
      - yacy-tor
      - tor-egress
    restart: unless-stopped

  privoxy:
    build:
      context: ./docker
      dockerfile: Dockerfile.privoxy
    container_name: privoxy
    depends_on:
      - tor
    networks:
      - yacy-tor
    restart: unless-stopped

  yacy:
    image: yacy/yacy_search_server:latest
    container_name: yacy
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:${YACY_HTTP_PORT:-8090}:8090"
      - "${LAN_BIND_IP:-127.0.0.1}:${YACY_HTTPS_PORT:-8443}:8443"
    depends_on:
      - privoxy
    networks:
      - yacy-tor
    restart: unless-stopped
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--Xmx1g}

networks:
  yacy-tor:
    internal: true
    driver: bridge
  tor-egress:
    driver: bridge
